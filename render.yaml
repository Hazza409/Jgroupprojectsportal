# Render Blueprint — one-file deploy of the J Group dashboard.
# Provisions: the Next.js web service + a managed Postgres database + a
# persistent disk for uploaded files (photos, recon sheets, invoices, docs).
# See DEPLOYMENT.md for the click-by-click walkthrough.

databases:
  - name: jgroup-db
    databaseName: jgroup
    # UPGRADE THIS. A free Render Postgres EXPIRES and is then DELETED with all
    # of its data — there is no backup on the free plan. Render's current
    # documented terms are 30 days from creation plus a 14-day grace period;
    # this database was created under earlier terms (the note here used to say
    # 90 days), so the only reliable expiry date is the one on the database's
    # own page in the Render dashboard. Check it there, not here.
    #
    # Upgrading is in place: the database and its data are kept and only the
    # compute plan changes, so there is no dump/restore and DATABASE_URL does
    # not move. Paid plans also add the automatic backups the free one lacks.
    plan: free

services:
  - type: web
    name: jgroup-dashboard
    runtime: node
    plan: starter # paid (~$7/mo) — required for the persistent disk below
    # --include=dev forces build tools (prisma, typescript, tailwind, tsx) to
    # install even though Render runs in production mode — without this the
    # build fails with "prisma: not found" / "Please install typescript".
    buildCommand: npm install --include=dev && npm run build
    # Migrations run in preDeploy, NOT in the start command.
    #
    # With them in startCommand, every deploy took the old container down and
    # then had to finish `prisma migrate deploy` + ensure-admin + a cold Next
    # start before anything could answer — and every request that landed in
    # that window got a 502. Render runs preDeployCommand after the build and
    # BEFORE the new version goes live, while the old one is still serving, so
    # the migration time no longer costs uptime. If a migration fails the
    # deploy stops and the old version keeps running, instead of leaving a
    # container that exits on boot.
    #
    # ./node_modules/.bin/prisma rather than npx: the binary is already there
    # from the build (--include=dev), so this can't stall on a registry lookup.
    #
    # ensure-admin runs here too, for the same reason: it opens a cold Prisma
    # client and makes a round trip to the database, and at boot that happened
    # BEFORE Next started listening — several seconds added to the deploy's 502
    # window, every deploy, for a check that only does anything on a completely
    # empty database. In preDeploy the old container is still serving while it
    # runs, so it costs no downtime.
    preDeployCommand: ./node_modules/.bin/prisma migrate deploy && node scripts/ensure-admin.js
    # NEXTAUTH_URL is taken from the public URL Render assigns this service.
    #
    # migrate deploy appears here AS WELL as in preDeploy, deliberately. When
    # preDeploy has run, this is a no-op check (~1s) — nowhere near the old 502
    # window, which came from applying real migrations at boot via npx. But if
    # the service's dashboard config ever drops the preDeploy step, the boot
    # still applies pending migrations rather than starting an app whose queries
    # reference columns the database doesn't have — which kills every money page
    # at once. A one-second check is cheap insurance against a bricked site.
    # Boot does the least it can: a no-op migration check, then serve. Anything
    # that opens a database connection before Next listens is time the site
    # spends returning 502.
    #
    # ensure-admin is deliberately NOT here any more. It only acts on a
    # completely empty database — by which point the site has no company,
    # projects or claims either, so being locked out is the least of the
    # problems and is recoverable from the Render shell. That is not worth
    # several seconds of downtime on every single deploy.
    startCommand: ./node_modules/.bin/prisma migrate deploy && NEXTAUTH_URL=$RENDER_EXTERNAL_URL npm run start
    healthCheckPath: /login
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jgroup-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true # Render generates a strong secret automatically
      - key: STORAGE_DRIVER
        value: local # uploads go to the persistent disk below
      - key: LOCAL_STORAGE_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "20"
      # Email: dashboard-managed so sending can be switched on without a code
      # push. Unset EMAIL_DRIVER → "console" (logs only). Gmail path: set
      # EMAIL_DRIVER=smtp + SMTP_USER + SMTP_PASS (Gmail App Password).
      # Resend path: EMAIL_DRIVER=resend + RESEND_API_KEY (+ verified domain).
      - key: EMAIL_DRIVER
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Xero (optional, read-only sync) — leave blank unless connecting Xero:
      - key: XERO_CLIENT_ID
        sync: false
      - key: XERO_CLIENT_SECRET
        sync: false
      - key: XERO_REDIRECT_URI
        sync: false
